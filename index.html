button             <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technix-Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- NAGŁÓWEK -->
    <div class="flex items-center justify-between p-4 bg-gray-950 border-b border-gray-800">
        <button onclick="switchTab('profile')" class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold text-xs border border-purple-400">T</button>
        <span id="header-title" class="font-bold text-base">Technix-Pro</span>
        <i class="fa-solid fa-bell text-gray-400"></i>
    </div>

    <!-- ZAWARTOŚĆ -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <div id="tab-home" class="tab-content">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                <h3 class="font-bold text-purple-400 text-sm mb-1">Sieć Społeczna</h3>
                <p class="text-xs text-gray-300">Strona działa poprawnie!</p>
            </div>
        </div>
        <div id="tab-gift" class="tab-content hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                <h3 class="font-bold text-purple-400 text-sm">Strefa Bonusów</h3>
            </div>
        </div>
        <div id="tab-crypto" class="tab-content hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                <h3 class="font-bold text-purple-400 text-sm">Kryptowaluty</h3>
            </div>
        </div>
        <div id="tab-wallet" class="tab-content hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                <h3 class="font-bold text-purple-400 text-sm">Portfel</h3>
            </div>
        </div>
        <div id="tab-profile" class="tab-content hidden">
            <div class="bg-gray-900 p-5 rounded-xl border border-gray-800 text-center space-y-3">
                <div class="w-16 h-16 bg-purple-600 rounded-full mx-auto flex items-center justify-center text-xl font-bold border-2 border-purple-400">T</div>
                <h2 class="text-base font-bold">TechnixUser</h2>
            </div>
        </div>
    </div>

    <!-- DOLNY PASEK -->
    <div class="bg-gray-950 border-t border-gray-800 py-3 flex justify-around items-center">
        <button onclick="switchTab('home')" class="nav-btn text-purple-500 text-xl"><i class="fa-solid fa-house"></i></button>
        <button onclick="switchTab('gift')" class="nav-btn text-gray-400 text-xl"><i class="fa-solid fa-gift"></i></button>
        <button onclick="switchTab('crypto')" class="nav-btn text-gray-400 text-xl"><i class="fa-brands fa-bitcoin"></i></button>
        <button onclick="switchTab('wallet')" class="nav-btn text-gray-400 text-xl"><i class="fa-solid fa-wallet"></i></button>
        <button onclick="switchTab('profile')" class="nav-btn text-gray-400 text-xl"><i class="fa-solid fa-user"></i></button>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('tab-' + tabId);
            if (target) target.classList.remove('hidden');
        }
    </script>
</body>
</html>
