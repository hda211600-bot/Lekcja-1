<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technix-Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- GÓRNY PASEK -->
    <div class="flex items-center justify-between p-4 bg-gray-950 border-b border-gray-800">
        <button onclick="switchTab('profile')" class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold text-xs">T</button>
        <span id="title" class="font-bold text-base">Technix-Pro</span>
        <i class="fa-solid fa-bell text-gray-400"></i>
    </div>

    <!-- TREŚĆ GŁÓWNA -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <!-- DOM -->
        <div id="tab-home" class="tab-content">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                <h3 class="font-bold text-purple-400">Sieć Społeczna</h3>
                <p class="text-xs text-gray-300">Witaj w głównej sekcji Technix-Pro!</p>
            </div>
        </div>

        <!-- PREZENT / BONUSY -->
        <div id="tab-gift" class="tab-content hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                <h3 class="font-bold text-purple-400">Strefa Bonusów</h3>
                <p class="text-xs text-gray-300">Promocje, nagrody i zadania do zrobienia.</p>
            </div>
        </div>

        <!-- CRYPTO -->
        <div id="tab-crypto" class="tab-content hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                <h3 class="font-bold text-purple-400">Kryptowaluty</h3>
                <p class="text-xs text-gray-300">Kursy walut i rynek.</p>
            </div>
        </div>

        <!-- PORTFEL -->
        <div id="tab-wallet" class="tab-content hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                <h3 class="font-bold text-purple-400">Mój Portfel</h3>
                <p class="text-xs text-gray-300">Stan konta i saldo.</p>
            </div>
        </div>

        <!-- PROFIL -->
        <div id="tab-profile" class="tab-content hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center space-y-3">
                <h3 class="font-bold text-purple-400">Profil Użytkownika</h3>
                <div class="w-16 h-16 bg-purple-600 rounded-full mx-auto flex items-center justify-center text-xl font-bold">T</div>
                <p class="text-sm font-bold">TechnixUser</p>
            </div>
        </div>

    </div>

    <!-- DOLNY PASEK NAWIGACYJNY (NIEZNIKAJĄCY) -->
    <div class="bg-gray-950 border-t border-gray-800 py-3 flex justify-around items-center">
        <button onclick="switchTab('home')" class="text-purple-500 text-xl"><i class="fa-solid fa-house"></i></button>
        <button onclick="switchTab('gift')" class="text-gray-400 hover:text-purple-400 text-xl"><i class="fa-solid fa-gift"></i></button>
        <button onclick="switchTab('crypto')" class="text-gray-400 hover:text-purple-400 text-xl"><i class="fa-brands fa-bitcoin"></i></button>
        <button onclick="switchTab('wallet')" class="text-gray-400 hover:text-purple-400 text-xl"><i class="fa-solid fa-wallet"></i></button>
        <button onclick="switchTab('profile')" class="text-gray-400 hover:text-purple-400 text-xl"><i class="fa-solid fa-user"></i></button>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }
    </script>
</body>
</html>
