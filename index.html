<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technix-Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- NAGŁÓWEK GÓRNY -->
    <div class="flex items-center justify-between p-4 bg-gray-950 border-b border-gray-800 flex-shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="switchTab('profile', 'Logo TECHNIXPRO')" class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold text-xs border border-purple-400">T</button>
            <span id="header-title" class="font-bold text-base">Sieć społeczna</span>
        </div>
        <div class="flex items-center space-x-4 text-base text-gray-400">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bell"></i>
        </div>
    </div>

    <!-- ZAWARTOŚĆ STRONY -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <!-- DOM -->
        <div id="tab-home" class="tab-content space-y-3">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                <h3 class="font-bold text-purple-400 text-sm mb-1">Sieć Społeczna</h3>
                <p class="text-xs text-gray-300">Witaj w głównej sekcji Technix-Pro!</p>
            </div>
        </div>

        <!-- BONUSY -->
        <div id="tab-gift" class="tab-content space-y-3 hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                <h3 class="font-bold text-purple-400 text-sm">Strefa Bonusów</h3>
                <p class="text-xs text-gray-300 mt-1">Promocje, nagrody i zadania.</p>
            </div>
        </div>

        <!-- KRYPTOWALUTY -->
        <div id="tab-crypto" class="tab-content space-y-3 hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                <h3 class="font-bold text-purple-400 text-sm">Kryptowaluty</h3>
                <p class="text-xs text-gray-300 mt-1">Rynek i kursy walut.</p>
            </div>
        </div>

        <!-- PORTFEL -->
        <div id="tab-wallet" class="tab-content space-y-3 hidden">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                <h3 class="font-bold text-purple-400 text-sm">Portfel</h3>
                <p class="text-xs text-gray-300 mt-1">Stan konta i finanse.</p>
            </div>
        </div>

        <!-- PROFIL -->
        <div id="tab-profile" class="tab-content space-y-3 hidden">
            <div class="bg-gray-900 p-5 rounded-xl border border-gray-800 text-center space-y-3">
                <div class="w-16 h-16 bg-purple-600 rounded-full mx-auto flex items-center justify-center text-xl font-bold border-2 border-purple-400">T</div>
                <h2 class="text-base font-bold">TechnixUser</h2>
                <div class="grid grid-cols-2 gap-2 text-xs pt-2">
                    <div class="bg-gray-950 p-2 rounded-lg border border-gray-800">
                        <span class="text-gray-400 block">Punkty PRO</span>
                        <span class="font-bold text-purple-400">1,250</span>
                    </div>
                    <div class="bg-gray-950 p-2 rounded-lg border border-gray-800">
                        <span class="text-gray-400 block">Status</span>
                        <span class="font-bold text-green-400">PRO VIP</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- DOLNY PASEK NAWIGACJI -->
    <div class="bg-gray-950 border-t border-gray-800 py-3 flex justify-around items-center flex-shrink-0">
        <button onclick="switchTab('home', 'Sieć społeczna')" class="nav-btn text-purple-500 text-xl" data-target="home"><i class="fa-solid fa-house"></i></button>
        <button onclick="switchTab('gift', 'Bonusy')" class="nav-btn text-gray-400 hover:text-purple-400 text-xl" data-target="gift"><i class="fa-solid fa-gift"></i></button>
        <button onclick="switchTab('crypto', 'Kryptowaluty')" class="nav-btn text-gray-400 hover:text-purple-400 text-xl" data-target="crypto"><i class="fa-brands fa-bitcoin"></i></button>
        <button onclick="switchTab('wallet', 'Portfel')" class="nav-btn text-gray-400 hover:text-purple-400 text-xl" data-target="wallet"><i class="fa-solid fa-wallet"></i></button>
        <button onclick="switchTab('profile', 'Logo TECHNIXPRO')" class="nav-btn text-gray-400 hover:text-purple-400 text-xl" data-target="profile"><i class="fa-solid fa-user"></i></button>
    </div>

    <script>
        function switchTab(tabId, titleText) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('tab-' + tabId);
            if (target) target.classList.remove('hidden');

            if (titleText) document.getElementById('header-title').textContent = titleText;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-purple-500');
                btn.classList.add('text-gray-400');
                if (btn.getAttribute('data-target') === tabId) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-purple-500');
                }
            });
        }
    </script>
</body>
</html>
