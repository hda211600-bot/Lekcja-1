<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuCoin Clone - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            padding: 16px;
        }

        /* Header / Balance Card */
        .balance-card {
            background-color: #1a1b1e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-title {
            color: #848e9c;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
        }

        .balance-pnl {
            color: #f6465d;
            font-size: 14px;
            margin-top: 6px;
        }

        .btn-deposit {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Grid Feature Cards */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .menu-item {
            background-color: #1a1b1e;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #eaecef;
        }

        /* Markets Section */
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .market-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .market-item {
            background-color: #1a1b1e;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .market-name {
            font-weight: bold;
            font-size: 16px;
        }

        .market-sub {
            color: #848e9c;
            font-size: 12px;
        }

        .price-badge {
            background-color: #0ecb81;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .price-badge.red {
            background-color: #f6465d;
        }
    </style>
</head>
<body>

    <!-- Sekcja balansu -->
    <div class="balance-card">
        <div>
            <div class="balance-title">Total Assets (USDT)</div>
            <div class="balance-amount">2.67</div>
            <div class="balance-pnl">Today's PnL -$150.45</div>
        </div>
        <button class="btn-deposit">Deposit</button>
    </div>

    <!-- Szybkie menu -->
    <div class="grid-menu">
        <div class="menu-item">Rewards Hub</div>
        <div class="menu-item">KuLeague</div>
        <div class="menu-item">KuMining</div>
        <div class="menu-item">Events Hub</div>
        <div class="menu-item">Futures Perks</div>
        <div class="menu-item">Shark Fin</div>
        <div class="menu-item">KCUSD</div>
        <div class="menu-item">More</div>
    </div>

    <!-- Lista rynkowa -->
    <div class="section-title">Rynek</div>
    <div class="market-list">
        <div class="market-item">
            <div>
                <div class="market-name">MHA</div>
                <div class="market-sub">$0.054333</div>
            </div>
            <div class="price-badge red">-0.15%</div>
        </div>
        <div class="market-item">
            <div>
                <div class="market-name">ON</div>
                <div class="market-sub">$0.1723</div>
            </div>
            <div class="price-badge">+5.49%</div>
        </div>
    </div>

</body>
</html>
